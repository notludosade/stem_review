<meta charset="UTF-8">
<link rel="icon" href="favicon.ico?v=1" type="image/x-icon">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Problem Set — STEM+</title>
<link rel="stylesheet" href="assets/style.css">
<script src="assets/problem-banks.js" defer></script>
<script src="assets/problem-sets.js" defer></script>
<div class="page" data-category="problem-sets">
  <span class="kicker">STEM+ · Problem Sets</span>
  <h1 data-problem-title>Problem Set</h1>
  <p class="subtitle" data-problem-subtitle>Loading practice bank…</p>
  <p class="nav-links"><a href="problem-sets.html" class="nav-toc">← All Problem Sets</a> <a href="index.html" class="nav-toc">STEM+ Home</a></p>

  <div class="problem-toolbar">
    <label for="problem-topic">Practice topic</label>
    <select id="problem-topic" data-topic-filter>
      <option value="all">All topics</option>
    </select>
    <button type="button" class="problem-reset" data-problem-reset>Reset saved progress</button>
  </div>

  <p class="problem-stats" data-problem-stats aria-live="polite"></p>

  <div class="quiz problem-card" data-problem-set>
    <div class="problem-meta">
      <span data-problem-progress></span>
      <span data-problem-topic></span>
    </div>
    <p class="quiz-prompt problem-prompt" data-problem-prompt></p>
    <div class="quiz-choices" data-problem-choices></div>
    <div class="quiz-fill-row" data-problem-fill>
      <label class="sr-only" for="problem-answer">Your answer</label>
      <input class="quiz-fill-input" id="problem-answer" data-problem-input inputmode="decimal" autocomplete="off" placeholder="Enter number, fraction, or percent">
      <button type="button" class="quiz-fill-check" data-problem-check>Check answer</button>
    </div>
    <p class="quiz-feedback" data-problem-feedback aria-live="polite" hidden></p>
    <p class="quiz-explain" data-problem-explanation hidden></p>
    <button type="button" class="widget-btn problem-next" data-problem-next hidden>Next question</button>
  </div>

  <footer class="lesson-footer">Progress stays in this browser. Problem Sets do not affect course exam scores.</footer>
</div>
